# World folder for the end-to-end tests with the host (F04): small, with a structure of the
# author (structures/tower.ts).
version: 2
name: Mondo di prova
terrain:
  seed: 7
  generator: 1
  size: [128, 96, 128]
player:
  at: [64, 64]
places:
  - { id: pozzo, name: Pozzo, at: [64, 59] }
