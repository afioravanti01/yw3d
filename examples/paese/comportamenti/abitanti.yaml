# Behaviors of the villagers of examples/paese, used by the characters with `use`.
- name: passeggio
  description: Un giro tra alcune tappe, con una pausa a ognuna e un saluto a chi si avvicina.
  params:
    tappe: { type: list, of: id }
    pausa: { type: duration, default: 3s }
    saluto: { type: text, default: Buongiorno! }
  memory: { counters: [giri] }
  routine:
    # walk_to with a list visits the stops in order.
    - walk_to: $tappe
    - wait: $pausa
    - count: giri
    - if: [{ counter: giri, equals: 3 }, { chance: 0.5 }]
      then:
        - say: Tre giri, ora mi riposo un poco.
        - wait: 10s
        - count: giri
          to: 0
  reactions:
    - on: { near: player, within: 5 }
      every: 30s
      do:
        - look_at: player
        - say: $saluto
