# Example world folder of yw3d: the default valley with 20 villagers who start in the square and
# walk among the places of the village. They all use the same behavior of the library, written in
# comportamenti/abitanti.yaml, each with its own stops (BEHAV-006).
# Run it with: yw3d examples/paese
# Coordinates are in blocks (1 block = 0.5 m); see worlds/README.md for the format.
version: 2
name: Il paese
description: La valle con venti abitanti che passeggiano tra i luoghi del borgo e salutano chi incontrano.
terrain:
  seed: 1
  generator: 1

player:
  at: [158, 66]
  yaw: 0

places:
  - { id: piazza, name: Piazza, at: [158, 66] }
  - { id: pozzo, name: Pozzo, at: [132, 58] }
  - { id: orti, name: Orti, at: [118, 86] }
  - { id: mercato, name: Mercato, at: [150, 92] }
  - { id: riva, name: Riva del laghetto, at: [182, 100] }
  - { id: fienile, name: Fienile, at: [180, 38] }

# The library of behaviors: a file of this folder.
behaviors:
  - file: comportamenti/abitanti.yaml

structures:
  # The village, on the flat land in the north.
  - type: stone_farmhouse
    name: Casolare grande
    at: [140, 42]
    params: { width: 16, depth: 10 }
  - type: stone_farmhouse
    name: Casolare di levante
    at: [178, 50]
    rotation: 90
    params: { width: 13, depth: 9 }
  - type: wooden_hut
    name: Capanno della piazza
    at: [150, 76]
    rotation: 180
  - type: wooden_hut
    name: Capanno di ponente
    at: [112, 74]
    rotation: 270
  - type: wooden_hut
    name: Capanno del nord
    at: [208, 30]
  - type: wooden_hut
    name: Capanno del laghetto
    at: [205, 78]
    rotation: 180
  - type: oak
    name: Quercia della piazza
    at: [158, 58]
    params: { height: 19 }

  # Ponds: one south of the village, one in the south-western meadow.
  - type: pond
    name: Laghetto del borgo
    at: [196, 112]
    params: { radius: 10, depth: 3 }
  - type: pond
    name: Stagno di ponente
    at: [88, 330]
    params: { radius: 15, depth: 5 }

scatter:
  # Mixed woods in the east and in the south.
  - name: Bosco di levante
    types: { oak: 3, birch: 2 }
    area: { circle: { center: [450, 66], radius: 46 } }
    density: 4
    minDistance: 6
  - name: Bosco del sud
    types: { oak: 2, birch: 3 }
    area: { circle: { center: [340, 405], radius: 60 } }
    density: 3
    minDistance: 6
  # Willows along the shores.
  - name: Salici del laghetto
    types: { willow: 1 }
    area: { circle: { center: [196, 112], radius: 20 } }
    count: 4
    minDistance: 7
  - name: Salici dello stagno
    types: { willow: 1 }
    area: { circle: { center: [88, 330], radius: 27 } }
    count: 5
    minDistance: 7
  # Lone trees in the meadows, all over the valley.
  - name: Alberi dei prati
    types: { oak: 2, birch: 1 }
    area: { rect: { from: [8, 8], to: [504, 504] } }
    density: 0.15
    minDistance: 22

characters:
  - id: p01
    name: Abitante 1
    at: [146, 60]
    behavior:
      use: passeggio
      params:
        tappe: [piazza, pozzo, orti, mercato, riva, fienile]
        pausa: 2s
        saluto: Buongiorno!
  - id: p02
    name: Abitante 2
    at: [151, 60]
    behavior:
      use: passeggio
      params:
        tappe: [pozzo, mercato, fienile]
        pausa: 3s
        saluto: Salve!
  - id: p03
    name: Abitante 3
    at: [156, 60]
    behavior:
