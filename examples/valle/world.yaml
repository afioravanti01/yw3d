# Example world folder of yw3d: the default valley with four characters. Tobia and Nina follow
# behaviors written here in YAML (docs/comportamenti.md); the guard and the fisherwoman are
# driven by programs in Python and JavaScript (docs/controllori.md).
# Run it with: yw3d examples/valle
# Coordinates are in blocks (1 block = 0.5 m); see worlds/README.md for the format.
version: 2
name: La valle
description: >-
  Una valle con un piccolo borgo di case in pietra e in legno, gli orti a ponente, un laghetto a
  sud e due boschi. Nel borgo vivono il guardiano, la pescatrice, il garzone Tobia e Nina.
terrain:
  seed: 1
  generator: 1

# The player starts in the village square, looking north towards the farmhouses.
player:
  at: [158, 66]
  yaw: 0

# Named places that are not structures: characters can go there (walk_to: piazza).
places:
  - id: piazza
    name: Piazza del borgo
    description: La piazza al centro del borgo, con la grande quercia.
    at: [158, 66]
  - id: orti
    name: Orti di ponente
    description: Gli orti a ovest del borgo, dove lavora Nina.
    area: { rect: { from: [112, 84], to: [128, 96] } }
  - id: borgo
    name: Borgo
    area: { rect: { from: [110, 25], to: [215, 100] } }

structures:
  # The village, on the flat land in the north.
  - type: stone_farmhouse
    id: casolare
    name: Casolare grande
    at: [140, 42]
    params: { width: 16, depth: 10 }
  - type: stone_farmhouse
    name: Casolare di levante
    at: [178, 50]
    rotation: 90
    params: { width: 13, depth: 9 }
  - type: wooden_hut
    name: Capanno della piazza
    at: [150, 76]
    rotation: 180
  - type: wooden_hut
    name: Capanno di ponente
    at: [112, 74]
    rotation: 270
  - type: wooden_hut
    name: Capanno del nord
    at: [208, 30]
  - type: wooden_hut
    name: Capanno del laghetto
    at: [205, 78]
    rotation: 180
  - type: oak
    name: Quercia della piazza
    at: [158, 58]
    params: { height: 19 }

  # Ponds: one south of the village, one in the south-western meadow.
  - type: pond
    id: laghetto1
    name: Laghetto del borgo
    at: [196, 112]
    params: { radius: 10, depth: 3 }
  - type: pond
    name: Stagno di ponente
    at: [88, 330]
    params: { radius: 15, depth: 5 }

scatter:
  # Mixed woods in the east and in the south.
  - name: Bosco di levante
    types: { oak: 3, birch: 2 }
    area: { circle: { center: [450, 66], radius: 46 } }
    density: 4
    minDistance: 6
  - name: Bosco del sud
    types: { oak: 2, birch: 3 }
    area: { circle: { center: [340, 405], radius: 60 } }
    density: 3
    minDistance: 6
  # Willows along the shores.
  - name: Salici del laghetto
    types: { willow: 1 }
    area: { circle: { center: [196, 112], radius: 20 } }
    count: 4
    minDistance: 7
  - name: Salici dello stagno
    types: { willow: 1 }
    area: { circle: { center: [88, 330], radius: 27 } }
    count: 5
    minDistance: 7
  # Lone trees in the meadows, all over the valley.
  - name: Alberi dei prati
    types: { oak: 2, birch: 1 }
    area: { rect: { from: [8, 8], to: [504, 504] } }
    density: 0.15
    minDistance: 22

# Characters: Tobia and Nina follow a behavior in YAML; the guard and the fisherwoman are driven
# by a program of this folder.
characters:
  # Tobia asks where to go: write a place of the valley, e.g. «laghetto1» or «vai in piazza».
  - id: tobia
    name: Tobia
    description: Il garzone del fabbro, sempre in cerca di commissioni.
    at: [154, 70]
    appearance: { shirt: '#8e4a3a', hair: '#3b2a1c' }
    behavior:
      memory: { counters: [commissioni] }
      routine:
        - wait: 3s
        - ask: Buongiorno! Dove devo andare?
          timeout: 40s
          then:
            - say: Vado subito a {answer}!
            - walk_to: answer
              on_fail:
                - say: Da qui non riesco ad arrivarci.
            - count: commissioni
            - say: Eccomi a {answer}.
            - wait: 5s
            - walk_to: piazza
          not_understood:
            - say: Non conosco quel posto. Prova con un nome della valle, come laghetto1.
          no_answer:
            - wait: 20s
      reactions:
        - on: interacted
          do:
            - look_at: player
            - say: Ciao {player}! Scrivimi dove andare, con Invio.

  # Nina works in the fields and takes a break in the square: two states.
  - id: nina
    name: Nina
    description: Contadina degli orti di ponente.
    at: [120, 88]
    appearance: { shirt: '#6f7f3a', hair: '#b07a3a' }
    behavior:
      start: lavoro
      states:
        lavoro:
          routine:
            - walk_to: orti
            - wait: 8s
            - say: Queste zucchine crescono bene.
            - walk_to: [124, 92]
            - wait: 8s
          reactions:
            - on: { after: 90s }
              do: [{ goto: riposo }]
        riposo:
          routine:
            - walk_to: piazza
            - say: Una pausa in piazza ci vuole.
            - wait: 20s
            - goto: lavoro
      reactions:
        - on: { near: player, within: 6 }
          every: 60s
          do:
            - look_at: player
            - say: Salve, {player}!
        - on: { heard: { from: player, to_me: true } }
          do:
            - look_at: player
            - say: Scusa, ho da fare. Chiedi a Tobia.

  - id: guardiano
    name: Bruno
    at: [160, 70]
    appearance: { shirt: '#4f6a5a', trousers: '#3f4b3c', hair: '#2e2118' }
    controller: { command: python3 controllers/guardiano.py }
  - id: pescatrice
    name: Marta
    at: [182, 108]
    yaw: 90
    appearance: { shirt: '#b38a3e', hair: '#8a8a86' }
    controller: { command: node controllers/pescatrice.mjs }
