# Example world folder of yw3d: the valley with LLM agents (docs/agenti.md). Marta, the
# fisherwoman, is driven by Codex and Anselmo, the wise man, by opencode, both on this machine;
# Nina by the fake brain, which needs no LLM. Ask them things, or ask Marta to talk with Anselmo.
# Codex must be the first in the PATH of the terminal that starts yw3d.
# Run it with: yw3d examples/agenti
# Coordinates are in blocks (1 block = 0.5 m); see worlds/README.md for the format.
version: 2
name: La valle degli agenti
description: >-
  Una valle con un piccolo borgo di case in pietra e in legno, gli orti a ponente, un laghetto a
  sud e due boschi. Nel borgo vivono il guardiano, la pescatrice, il garzone Tobia e Nina.
terrain:
  seed: 1
  generator: 1

# The player starts in the village square, looking north towards the farmhouses.
player:
  at: [178, 100]
  yaw: 180

# Named places that are not structures: characters can go there (walk_to: piazza).
places:
  - id: piazza
    name: Piazza del borgo
    description: La piazza al centro del borgo, con la grande quercia.
    at: [158, 66]
  - id: orti
    name: Orti di ponente
    description: Gli orti a ovest del borgo, dove lavora Nina.
    area: { rect: { from: [112, 84], to: [128, 96] } }
  - id: borgo
    name: Borgo
    area: { rect: { from: [110, 25], to: [215, 100] } }

structures:
  # The village, on the flat land in the north.
  - type: stone_farmhouse
    id: casolare
    name: Casolare grande
    at: [140, 42]
    params: { width: 16, depth: 10 }
  - type: stone_farmhouse
    name: Casolare di levante
    at: [178, 50]
    rotation: 90
    params: { width: 13, depth: 9 }
  - type: wooden_hut
    name: Capanno della piazza
    at: [150, 76]
    rotation: 180
  - type: wooden_hut
    name: Capanno di ponente
    at: [112, 74]
    rotation: 270
  - type: wooden_hut
    name: Capanno del nord
    at: [208, 30]
  - type: wooden_hut
    name: Capanno del laghetto
    at: [205, 78]
    rotation: 180
  - type: oak
    name: Quercia della piazza
    at: [158, 58]
    params: { height: 19 }

  # Ponds: one south of the village, one in the south-western meadow.
  - type: pond
    id: laghetto1
    name: Laghetto del borgo
    at: [196, 112]
    params: { radius: 10, depth: 3 }
  - type: pond
    name: Stagno di ponente
    at: [88, 330]
    params: { radius: 15, depth: 5 }

scatter:
  # Mixed woods in the east and in the south.
  - name: Bosco di levante
    types: { oak: 3, birch: 2 }
    area: { circle: { center: [450, 66], radius: 46 } }
    density: 4
    minDistance: 6
  - name: Bosco del sud
    types: { oak: 2, birch: 3 }
    area: { circle: { center: [340, 405], radius: 60 } }
    density: 3
    minDistance: 6
  # Willows along the shores.
  - name: Salici del laghetto
    types: { willow: 1 }
    area: { circle: { center: [196, 112], radius: 20 } }
    count: 4
    minDistance: 7
  - name: Salici dello stagno
    types: { willow: 1 }
    area: { circle: { center: [88, 330], radius: 27 } }
    count: 5
    minDistance: 7
  # Lone trees in the meadows, all over the valley.
  - name: Alberi dei prati
    types: { oak: 2, birch: 1 }
    area: { rect: { from: [8, 8], to: [504, 504] } }
    density: 0.15
    minDistance: 22

# Settings of all the agents: a conversation between agents, without the player, lasts at most
# these lines in all; the agents know how many are left and close it naturally.
agents:
  conversation_turns: 12

# The same agent with other brains (docs/agenti.md), in place of Marta's `agent:` below:
#   agent: { mode: headless, cli: claude, model: sonnet, effort: low }        # Claude Code
#   agent: { mode: api, provider: anthropic, model: claude-haiku-4-5 }        # ANTHROPIC_API_KEY
#   agent: { mode: api, provider: openai, model: gpt-5-mini }                 # OPENAI_API_KEY
#   agent:                                                          # Ollama on this machine
#     { mode: api, provider: openai, base_url: 'http://localhost:11434/v1', model: llama3.1,
#       api_key_env: OLLAMA_KEY }                                   # any value, e.g. ollama
#   agent: { mode: fake }                                           # no LLM: fixed rules

# Characters: each one is an LLM agent declared here, without programs (docs/agenti.md).
# Stand near one and write to it with @name in the console on the right.
characters:
  # Marta asks Codex what to say and do. Ask her: «@Marta dove si pesca meglio?»,
  # «@Marta cosa vedi?», or anything else.
  - id: pescatrice
    name: Marta
    description: >-
      La pescatrice del laghetto del borgo. Ha studiato biologia marina e ora vive di pesca:
      conosce ogni pesce della valle, dei fiumi e del mare, dove vive, cosa mangia e quando
      abbocca. Burbera, ma non nega mai un consiglio a chi le chiede dove pescare.
    at: [182, 108]
    yaw: 90
    appearance: { shirt: '#b38a3e', hair: '#8a8a86' }
    agent:
      mode: headless
      cli: codex
      effort: low
      # Long answers: in full in the console, the beginning in her speech bubble.
      answers: long
      # The persona gives her a character and an expertise: she answers questions about fish
      # and the sea with what a marine biologist knows, also when this world has no answer.
      persona: >-
        Burbera ma generosa; parla poco e con parole semplici. Prima di fare la pescatrice ha
        studiato biologia marina: è un'esperta di ittiologia e di ecologia dei mari, dei laghi e
        dei fiumi. Conosce le specie, i loro habitat, il comportamento, l'alimentazione e la
        riproduzione, e ne parla con precisione quando glielo chiedono, sempre a modo suo.
  # Nina uses the fake brain: it answers with fixed rules, to try the world without an LLM.
  - id: nina
    name: Nina
    description: >-
      Contadina degli orti di ponente. Coltiva zucchine, pomodori e fagioli, conosce le stagioni
      della semina e del raccolto, e porta la verdura in piazza il sabato. Allegra e chiacchierona.
    at: [174, 104]
    appearance: { shirt: '#6f7f3a', hair: '#b07a3a' }
    agent: { mode: fake }
  # The wise man of the village: few words, full of meaning. Ask him anything: «@Anselmo cosa
  # conta davvero nella vita?», «@saggio perché la gente litiga?».
  - id: saggio
    name: Anselmo
    description: >-
      Il saggio del villaggio. Vecchio, lento nei gesti e nelle parole, ha visto passare molte
      stagioni. Tutti vanno da lui quando non sanno che strada prendere.
    at: [170, 98]
    appearance: { shirt: '#5a4a6e', trousers: '#3b3346', hair: '#e8e4dc', skin: '#d9a47a' }
    agent:
      mode: headless
      cli: opencode
      persona: >-
        Parla poco, con calma e con parole piene di significato: immagini semplici prese dalla
        natura, dal lavoro dei campi e del lago, che illuminano la domanda invece di chiuderla.
        Non fa prediche né elenchi; a volte risponde con una domanda che fa pensare. È gentile,
        un po' ironico, e non finge di sapere ciò che non sa.
  # Elisa, a monkey (body: monkey): every 20 s her agent decides by itself where to go.
  # She makes monkey sounds, never words; call her with «@Elisa vieni qui!».
  - id: elisa
    name: Elisa
    description: >-
      Una scimmietta curiosa e dispettosa che vive tra le querce del borgo. Le piacciono le
      persone, l'acqua del laghetto e rubare la frutta dagli orti.
    at: [176, 96]
    body: monkey
    agent:
      mode: headless
      cli: claude
      model: haiku
      initiative: autonomous
      every: 20
