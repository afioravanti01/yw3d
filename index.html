<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yw3d</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #dce8ec;
        font-family: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
      }
      #world {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #3d4a52;
        font-size: 15px;
      }
      #notice {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(900px, calc(100% - 32px));
        max-height: 40vh;
        overflow: auto;
        padding: 8px 14px;
        background: #fff4d6;
        color: #5a4210;
        border: 1px solid #e6c878;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      #notice .error {
        color: #8a1f11;
      }
      #debug {
        position: fixed;
        top: 12px;
        left: 12px;
        pointer-events: none;
      }
      #debug button {
        pointer-events: auto;
        cursor: pointer;
        color: #e8f0f2;
        font:
          12px/1.2 ui-monospace,
          'Cascadia Mono',
          Menlo,
          Consolas,
          monospace;
      }
      #debug-close {
        position: absolute;
        top: 2px;
        right: 2px;
        padding: 2px 7px;
        background: none;
        border: none;
        font-size: 16px !important;
        opacity: 0.75;
      }
      #debug-close:hover {
        opacity: 1;
      }
      #debug-stats {
        padding: 4px 10px;
        background: rgb(20 28 34 / 0.28);
        border: 1px solid rgb(232 240 242 / 0.35);
        border-radius: 6px;
      }
      #debug:not(.collapsed) #debug-stats,
      #debug.collapsed #debug-overlay,
      #debug.collapsed #debug-close {
        display: none;
      }
      #debug-overlay {
        /* Never under the message console on the right (A7.4). */
        max-width: calc(100vw - min(420px, 100vw - 32px) - 64px);
        box-sizing: border-box;
        white-space: pre-wrap;
        margin: 0;
        padding: 8px 30px 8px 10px;
        background: rgb(20 28 34 / 0.62);
        color: #e8f0f2;
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.45;
        pointer-events: none;
      }
      #bubbles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .label {
        position: absolute;
        left: 0;
        top: 0;
        /* Each label on its own compositing layer: moving it every frame over the WebGL canvas
           must not repaint the page, which left trails behind the names (T6.21+). */
        will-change: transform;
        backface-visibility: hidden;
        contain: layout paint;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .name {
        padding: 1px 7px;
        background: rgb(20 28 34 / 0.45);
        color: #f3f6f4;
        border-radius: 4px;
        font:
          12px/1.3 system-ui,
          sans-serif;
        white-space: nowrap;
      }
      .bubble {
        max-width: 260px;
        padding: 6px 10px;
        background: rgb(255 252 244 / 0.94);
        color: #2e2a24;
        border-radius: 10px;
        font:
          13px/1.35 system-ui,
          sans-serif;
        box-shadow: 0 2px 6px rgb(0 0 0 / 0.18);
        white-space: pre-wrap;
      }
      /* Markdown in the bubbles (A7.8). */
      .bubble p,
      .bubble ul,
      .bubble ol,
      .bubble pre {
        margin: 0;
      }
      .bubble ul,
      .bubble ol {
        padding-left: 18px;
      }
      .bubble code {
        padding: 0 3px;
        background: rgb(46 42 36 / 0.08);
        border-radius: 3px;
        font-family: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
      }
      /* The message console (DIALOG-005, A7.1, A7.4): a see-through block on the right, as high as
         the window, with the messages at the top and the box of the player at the bottom. The
         messages are free text, selectable; the rest of the block leaves the mouse to the scene. */
      #console {
        position: fixed;
        top: 16px;
        right: 16px;
        bottom: 16px;
        width: min(420px, calc(100% - 32px));
        box-sizing: border-box;
        padding: 6px 10px 10px;
        display: flex;
        flex-direction: column;
        background: rgb(255 255 255 / 0.72);
        border: 1px solid rgb(255 255 255 / 0.85);
        border-radius: 8px;
        box-shadow: 0 2px 10px rgb(0 0 0 / 0.12);
        color: #1d2a33;
        font:
          13px/1.5 ui-monospace,
          'Cascadia Mono',
          Menlo,
          Consolas,
          monospace;
        pointer-events: none;
      }
      #console.open {
        background: rgb(255 255 255 / 0.82);
      }
      #console > ol {
        flex: 1;
        min-height: 0;
        margin: 0;
        padding: 0 4px 0 0;
        overflow-y: auto;
        list-style: none;
        pointer-events: auto;
        user-select: text;
        cursor: text;
        scrollbar-width: thin;
        scrollbar-color: rgb(29 42 51 / 0.3) transparent;
      }
      #console > ol > li {
        margin: 0 0 6px;
        overflow-wrap: anywhere;
      }
      #console > ol > li.error {
        color: #a3261a;
      }
      /* The answer of a command (/help, /world) ends with a line. */
      #console > ol > li.info {
        padding-bottom: 6px;
        border-bottom: 1px solid rgb(29 42 51 / 0.25);
        color: #1f4f7a;
      }
      #console > ol p,
      #console > ol ul,
      #console > ol ol,
      #console > ol pre,
      #console > ol h3,
      #console > ol h4,
      #console > ol h5 {
        margin: 0 0 4px;
      }
      #console > ol ul,
      #console > ol ol {
        padding-left: 20px;
      }
      #console > ol h3,
      #console > ol h4,
      #console > ol h5 {
        font-size: 1em;
      }
      #console > ol code {
        padding: 0 3px;
        background: rgb(29 42 51 / 0.08);
        border-radius: 3px;
        font: inherit;
      }
      #console > ol pre {
        padding: 4px 6px;
        background: rgb(29 42 51 / 0.08);
        border-radius: 4px;
        white-space: pre-wrap;
      }
      #console > ol pre code {
        padding: 0;
        background: none;
      }
      #console > ol a {
        color: #1d5fa8;
      }
      #console .suggestions {
        margin: 6px 0 0;
        padding: 3px;
        list-style: none;
        background: rgb(255 255 255 / 0.95);
        border: 1px solid rgb(29 42 51 / 0.15);
        border-radius: 6px;
        pointer-events: auto;
      }
      #console .suggestions li {
        padding: 3px 9px;
        border-radius: 6px;
        cursor: pointer;
      }
      #console .suggestions li.selected {
        background: rgb(29 42 51 / 0.1);
      }
      #console textarea {
        display: block;
        resize: none;
        box-sizing: border-box;
        width: 100%;
        margin-top: 6px;
        padding: 7px 10px;
        border: 1px solid rgb(29 42 51 / 0.25);
        border-radius: 6px;
        background: rgb(255 255 255 / 0.9);
        color: #1d2a33;
        font: inherit;
        pointer-events: auto;
        outline: none;
      }
      #console textarea:disabled {
        opacity: 0.6;
      }
      #console button {
        align-self: flex-end;
        pointer-events: auto;
        cursor: pointer;
        color: #1d2a33;
        font:
          12px/1.2 ui-monospace,
          'Cascadia Mono',
          Menlo,
          Consolas,
          monospace;
      }
      #console .reduce {
        margin-bottom: 3px;
        padding: 0 7px 2px;
        background: rgb(29 42 51 / 0.08);
        border: none;
        border-radius: 6px;
        font-size: 16px;
        opacity: 0.8;
      }
      #console .reduce:hover {
        opacity: 1;
      }
      #console .reopen {
        padding: 4px 10px;
        background: rgb(255 255 255 / 0.72);
        border: 1px solid rgb(255 255 255 / 0.85);
        border-radius: 6px;
      }
      #console:not(.collapsed) .reopen,
      #console.collapsed > :not(.reopen) {
        display: none;
      }
      #console.collapsed {
        top: auto;
        padding: 0;
        background: none;
        border: none;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="loading">Generating the world…</div>
    <div id="bubbles"></div>
    <div id="console">
      <button type="button" class="reduce" title="Reduce the console">×</button>
      <ol aria-live="polite" aria-label="Messages"></ol>
      <ul class="suggestions" hidden></ul>
      <textarea
        rows="2"
        maxlength="520"
        autocomplete="off"
        spellcheck="false"
        aria-label="Message"
        placeholder="Enter to write… (@name to someone, /help; Shift+Enter new line)"
      ></textarea>
      <button type="button" class="reopen" title="Open the console">Messages</button>
    </div>
    <div id="notice" role="alert" hidden></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
