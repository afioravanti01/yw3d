<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yw3d</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #dce8ec;
        font-family: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
      }
      #world {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #3d4a52;
        font-size: 15px;
      }
      #notice {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(900px, calc(100% - 32px));
        max-height: 40vh;
        overflow: auto;
        padding: 8px 14px;
        background: #fff4d6;
        color: #5a4210;
        border: 1px solid #e6c878;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      #notice .error {
        color: #8a1f11;
      }
      #debug {
        position: fixed;
        top: 12px;
        left: 12px;
        pointer-events: none;
      }
      #debug button {
        pointer-events: auto;
        cursor: pointer;
        color: #e8f0f2;
        font:
          12px/1.2 ui-monospace,
          'Cascadia Mono',
          Menlo,
          Consolas,
          monospace;
      }
      #debug-close {
        position: absolute;
        top: 2px;
        right: 2px;
        padding: 2px 7px;
        background: none;
        border: none;
        font-size: 16px !important;
        opacity: 0.75;
      }
      #debug-close:hover {
        opacity: 1;
      }
      #debug-stats {
        padding: 4px 10px;
        background: rgb(20 28 34 / 0.28);
        border: 1px solid rgb(232 240 242 / 0.35);
        border-radius: 6px;
      }
      #debug:not(.collapsed) #debug-stats,
      #debug.collapsed #debug-overlay,
      #debug.collapsed #debug-close {
        display: none;
      }
      #debug-overlay {
        margin: 0;
        padding: 8px 30px 8px 10px;
        background: rgb(20 28 34 / 0.62);
        color: #e8f0f2;
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.45;
        pointer-events: none;
      }
      #bubbles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .label {
        position: absolute;
        left: 0;
        top: 0;
        /* Each label on its own compositing layer: moving it every frame over the WebGL canvas
           must not repaint the page, which left trails behind the names (T6.21+). */
        will-change: transform;
        backface-visibility: hidden;
        contain: layout paint;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .name {
        padding: 1px 7px;
        background: rgb(20 28 34 / 0.45);
        color: #f3f6f4;
        border-radius: 4px;
        font:
          12px/1.3 system-ui,
          sans-serif;
        white-space: nowrap;
      }
      .bubble {
        max-width: 260px;
        padding: 6px 10px;
        background: rgb(255 252 244 / 0.94);
        color: #2e2a24;
        border-radius: 10px;
        font:
          13px/1.35 system-ui,
          sans-serif;
        box-shadow: 0 2px 6px rgb(0 0 0 / 0.18);
        white-space: pre-wrap;
      }
      /* The message console (DIALOG-005, plan F07 P14): on the right, see-through; only the list
         and the box take the mouse, the rest of the scene keeps it. */
      #console {
        position: fixed;
        right: 16px;
        bottom: 16px;
        width: min(420px, calc(100% - 32px));
        display: flex;
        flex-direction: column;
        align-items: stretch;
        font:
          14px/1.4 system-ui,
          sans-serif;
        pointer-events: none;
      }
      #console ol {
        max-height: 60vh;
        margin: 0;
        padding: 0 2px 0 0;
        overflow-y: auto;
        list-style: none;
        pointer-events: auto;
        scrollbar-width: thin;
        scrollbar-color: rgb(232 240 242 / 0.4) transparent;
      }
      #console ol:empty {
        pointer-events: none;
      }
      #console li {
        width: fit-content;
        max-width: 100%;
        margin: 3px 0 0 auto;
        padding: 3px 9px;
        box-sizing: border-box;
        background: rgb(20 28 34 / 0.45);
        color: #f3f6f4;
        border-radius: 6px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #console li.error {
        color: #ffd0c4;
      }
      #console li.info {
        color: #cfe3ff;
      }
      #console ul {
        margin: 6px 0 0;
        padding: 3px;
        list-style: none;
        background: rgb(20 28 34 / 0.85);
        border-radius: 6px;
        pointer-events: auto;
      }
      #console ul li {
        margin: 0;
        width: auto;
        background: none;
        cursor: pointer;
      }
      #console ul li.selected {
        background: rgb(255 255 255 / 0.18);
      }
      #console input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 6px;
        padding: 7px 10px;
        border: 1px solid rgb(255 255 255 / 0.6);
        border-radius: 6px;
        background: rgb(20 28 34 / 0.78);
        color: #fff;
        font: inherit;
        pointer-events: auto;
        outline: none;
      }
      #console button {
        align-self: flex-end;
        pointer-events: auto;
        cursor: pointer;
        color: #e8f0f2;
        font:
          12px/1.2 ui-monospace,
          'Cascadia Mono',
          Menlo,
          Consolas,
          monospace;
      }
      #console .reduce {
        margin-bottom: 3px;
        padding: 0 7px 2px;
        background: rgb(20 28 34 / 0.35);
        border: none;
        border-radius: 6px;
        font-size: 16px;
        opacity: 0.8;
      }
      #console .reduce:hover {
        opacity: 1;
      }
      #console .reopen {
        padding: 4px 10px;
        background: rgb(20 28 34 / 0.28);
        border: 1px solid rgb(232 240 242 / 0.35);
        border-radius: 6px;
      }
      #console:not(.collapsed) .reopen,
      #console.collapsed > :not(.reopen) {
        display: none;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="loading">Generating the world…</div>
    <div id="bubbles"></div>
    <div id="console">
      <button type="button" class="reduce" title="Reduce the console">×</button>
      <ol aria-live="polite" aria-label="Messages"></ol>
      <ul hidden></ul>
      <input
        type="text"
        maxlength="520"
        autocomplete="off"
        aria-label="Message"
        placeholder="Write… (@name to someone, /help)"
        hidden
      />
      <button type="button" class="reopen" title="Open the console">Messages</button>
    </div>
    <div id="notice" role="alert" hidden></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
