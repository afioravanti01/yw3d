<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yw3d</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #dce8ec;
        font-family: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
      }
      #world {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #3d4a52;
        font-size: 15px;
      }
      #notice {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(900px, calc(100% - 32px));
        max-height: 40vh;
        overflow: auto;
        padding: 8px 14px;
        background: #fff4d6;
        color: #5a4210;
        border: 1px solid #e6c878;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      #notice .error {
        color: #8a1f11;
      }
      #debug-overlay {
        position: fixed;
        top: 12px;
        left: 12px;
        margin: 0;
        padding: 8px 10px;
        background: rgb(20 28 34 / 0.62);
        color: #e8f0f2;
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.45;
        pointer-events: none;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="loading">Generating the world…</div>
    <div id="notice" role="alert" hidden></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
