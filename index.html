<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yw3d</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #dce8ec;
        font-family: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
      }
      #world {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #3d4a52;
        font-size: 15px;
      }
      #notice {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(900px, calc(100% - 32px));
        max-height: 40vh;
        overflow: auto;
        padding: 8px 14px;
        background: #fff4d6;
        color: #5a4210;
        border: 1px solid #e6c878;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      #notice .error {
        color: #8a1f11;
      }
      #debug-overlay {
        position: fixed;
        top: 12px;
        left: 12px;
        margin: 0;
        padding: 8px 10px;
        background: rgb(20 28 34 / 0.62);
        color: #e8f0f2;
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.45;
        pointer-events: none;
      }
      #bubbles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .bubble {
        position: absolute;
        left: 0;
        top: 0;
        max-width: 260px;
        padding: 6px 10px;
        background: rgb(255 252 244 / 0.94);
        color: #2e2a24;
        border-radius: 10px;
        font:
          13px/1.35 system-ui,
          sans-serif;
        box-shadow: 0 2px 6px rgb(0 0 0 / 0.18);
        white-space: pre-wrap;
      }
      #chat {
        position: fixed;
        left: 16px;
        bottom: 16px;
        width: min(560px, calc(100% - 32px));
        font:
          14px/1.4 system-ui,
          sans-serif;
        pointer-events: none;
      }
      #chat ol {
        margin: 0 0 6px;
        padding: 0;
        list-style: none;
      }
      #chat li {
        width: fit-content;
        max-width: 100%;
        margin-top: 3px;
        padding: 3px 9px;
        background: rgb(20 28 34 / 0.55);
        color: #f3f6f4;
        border-radius: 6px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        transition: opacity 1.2s;
      }
      #chat li.error {
        color: #ffd0c4;
      }
      #chat li.faded {
        opacity: 0;
      }
      #chat.open li {
        opacity: 1;
      }
      #chat input {
        box-sizing: border-box;
        width: 100%;
        padding: 7px 10px;
        border: 1px solid rgb(255 255 255 / 0.6);
        border-radius: 6px;
        background: rgb(20 28 34 / 0.78);
        color: #fff;
        font: inherit;
        pointer-events: auto;
        outline: none;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="loading">Generating the world…</div>
    <div id="bubbles"></div>
    <div id="chat">
      <ol aria-live="polite"></ol>
      <input
        type="text"
        maxlength="500"
        autocomplete="off"
        aria-label="Parla"
        placeholder="Scrivi… (@id per rivolgerti a qualcuno, Invio per dire, Esc per annullare)"
        hidden
      />
    </div>
    <div id="notice" role="alert" hidden></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
